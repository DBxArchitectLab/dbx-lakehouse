resources:
  jobs:
    # Daily drift check: fails when any workspace-local group exists in this workspace. Paused for now (see
    # pause_status); when unpaused, it runs daily in uat and prod and stays paused in dev.
    identity_local_group_drift:
      name: identity-local-group-drift-check
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        # Paused until the migration is done in each environment (it fails while local groups exist); then UNPAUSED.
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - "dbxarchitectlab@gmail.com"
      tasks:
        - task_key: detect
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/migrate_workspace_groups.py
            parameters:
              - --config
              - ${workspace.file_path}/config/group_migration.yaml
              - --env
              - ${var.env}
              - --catalog
              - ${var.catalog}
              - --mode
              - plan
              - --fail-on-local-groups
              - "true"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.40.0
              - pyyaml
