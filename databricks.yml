bundle:
  name: dbx-lakehouse-ai-bi

include:
  - resources/*.yml

# src/notebooks/shared goes to /Workspace/Shared instead (scripts/deploy-shared-notebooks.sh, run by the pipeline),
# so it isn't also copied into the bundle's folder.
sync:
  exclude:
    - src/notebooks/shared/**

variables:
  catalog:
    description: Unity Catalog catalog of the environment (created by dbx-platform-infra-azure's bootstrap)
  schema:
    description: Schema for this bundle's tables
    default: lakehouse
  env:
    description: Environment of the target workspace (dev, uat or prod); used in migrated account group names

# Developers deploy their own copy to dev by hand (target dev). Everything shared, the dev-shared copy, uat and prod,
# is deployed by GitHub Actions as sp-dbx-lakehouse, never by hand.
targets:
  # Each developer deploys their own copy, as themselves: resources are prefixed "[dev <user>]", schedules are paused.
  dev:
    mode: development
    default: true
    workspace:
      host: "https://adb-7405609089943919.19.azuredatabricks.net"
    variables:
      catalog: dbxarchitectlab_dev
      env: dev

  # The shared dev copy, deployed by GitHub Actions (Run workflow -> dev) from any branch. One copy, owned and run by
  # sp-dbx-lakehouse; schedules are paused so it only runs when started (the pipeline starts it after each deploy).
  dev-shared:
    mode: production
    workspace:
      host: "https://adb-7405609089943919.19.azuredatabricks.net"
      # The service principal's own folder: only it (and workspace admins) can write there.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbxarchitectlab_dev
      env: dev
    presets:
      trigger_pause_status: PAUSED
    run_as:
      service_principal_name: "9a769c8e-a44b-4009-9378-719753df14c7"   # sp-dbx-lakehouse
    permissions:
      - service_principal_name: "9a769c8e-a44b-4009-9378-719753df14c7"   # sp-dbx-lakehouse, the deploying identity
        level: CAN_MANAGE
      - group_name: DBX_Architect_Lab_Admin
        level: CAN_MANAGE

  uat:
    mode: production
    workspace:
      host: "https://adb-7405605496889455.15.azuredatabricks.net"
      # The service principal's own folder: only it (and workspace admins) can write there.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbxarchitectlab_uat
      env: uat
    run_as:
      service_principal_name: "9a769c8e-a44b-4009-9378-719753df14c7"   # sp-dbx-lakehouse
    permissions:
      - service_principal_name: "9a769c8e-a44b-4009-9378-719753df14c7"   # sp-dbx-lakehouse, the deploying identity
        level: CAN_MANAGE
      - group_name: DBX_Architect_Lab_Admin
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: "https://adb-7405604784566671.11.azuredatabricks.net"
      # The service principal's own folder: only it (and workspace admins) can write there.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbxarchitectlab_prod
      env: prod
    run_as:
      service_principal_name: "9a769c8e-a44b-4009-9378-719753df14c7"   # sp-dbx-lakehouse
    permissions:
      - service_principal_name: "9a769c8e-a44b-4009-9378-719753df14c7"   # sp-dbx-lakehouse, the deploying identity
        level: CAN_MANAGE
      - group_name: DBX_Architect_Lab_Admin
        level: CAN_MANAGE
