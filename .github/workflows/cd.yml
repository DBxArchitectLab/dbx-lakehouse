name: Deploy

# Two ways to deploy, both as sp-dbx-lakehouse:
# - Merge to main (promotion): tests -> uat (deploy and smoke run) -> approval -> prod.
# - Run workflow (on demand): Actions -> Deploy -> Run workflow, pick the branch ("Use workflow from") and the
#   environment. dev and uat accept any branch; prod only main, and still waits for the prod environment's reviewers.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy the selected branch to
        type: choice
        options: [dev, uat, prod]
        default: dev

permissions:
  contents: read

env:
  # The bundle target sets the workspace host; the service principal signs in with its Databricks OAuth secret.
  DATABRICKS_AUTH_TYPE: oauth-m2m

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest -q tests

  # On demand: the selected branch to the selected environment.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deployment per environment at a time, shared with the promotion jobs below.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # dev deploys the shared dev copy; the dev target is each developer's own copy.
      TARGET: ${{ inputs.environment == 'dev' && 'dev-shared' || inputs.environment }}
    steps:
      - name: prod deploys only from main
        if: inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::prod deploys only from main; '${{ github.ref_name }}' was selected."
          exit 1
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t "$TARGET"
      - run: databricks bundle deploy -t "$TARGET"
      # Smoke test in dev and uat; prod's job runs on its schedule (or Run now).
      - if: inputs.environment != 'prod'
        run: databricks bundle run -t "$TARGET" sample_ingest

  # Promotion: what is merged to main.
  uat:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: uat
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t uat
      - run: databricks bundle deploy -t uat
      # Smoke test: run the sample job once in uat and wait for it; a failure stops the promotion to prod.
      - run: databricks bundle run -t uat sample_ingest

  prod:
    if: github.event_name == 'push'
    needs: uat
    runs-on: ubuntu-latest
    environment: prod  # add required reviewers to this environment: the approval gate before prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
