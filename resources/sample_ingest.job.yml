resources:
  jobs:
    # A starter job that proves the path from dev to uat to prod: it writes a small table into the bundle's schema.
    # Replace it with real pipelines; keep one job per file.
    sample_ingest:
      name: sample-ingest
      max_concurrent_runs: 1
      schedule:
        # Paused everywhere for now; set pause_status to UNPAUSED to run daily in uat and prod (development mode and
        # dev-shared keep it paused in dev).
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - "dbxarchitectlab@gmail.com"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.lakehouse.name}
      tasks:
        # No cluster: the task runs on serverless compute.
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/notebooks/sample_ingest.py
