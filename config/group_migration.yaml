# Workspace-local group migration: how account groups are named and where the account credentials are. Read by
# src/jobs/migrate_workspace_groups.py, which runs in each of dev, uat and prod and migrates that workspace's groups.
# The environment and the inventory catalog come from the bundle target (variables env and catalog).

account_host: "https://accounts.azuredatabricks.net"

naming:
  # Account group name for a local group. Must contain {group} and {env}: the same local group name in dev, uat and
  # prod always becomes three different account groups (data_engineers_dev, _uat, _prod), never one shared group.
  # The job refuses to start otherwise.
  template: "{group}_{env}"
  # When the account group has the local group's own name, the local group is renamed to this prefix + name first
  # (a workspace can't hold two groups with one name). Also how a re-run recognises a group it already renamed.
  temp_prefix: "db-temp-"

# Local groups to leave alone (admins, users and account users are always skipped).
exclude_groups: []

# Account groups that already exist, were not created by this migration, and may still be reused as a target.
# Anything not listed here and not in the registry table stops that group's migration instead of being taken over.
adopt_account_groups: []

# The account API calls (creating account groups and assigning them to the workspace) sign in as sp-dbx-lakehouse
# with its OAuth credentials; workspace calls use the job's own identity and need no secret. The client ID, the client
# secret and the account ID are secrets, in each of dev, uat and prod, in the scope the workspace bootstrap creates
# (dbx-platform-infra-azure, live/<env>/workspace-bootstrap/secret-scope-config.yaml). Stored by
# scripts/put-migration-secrets.sh.
credentials:
  scope: "sct_dbx_architect_lab"
  client_id_key: "sp-dbx-lakehouse-client-id"
  client_secret_key: "sp-dbx-lakehouse-client-secret"
  account_id_key: "databricks-account-id"
